query RewardsCartInput {
  presentmentCurrencyRate
  cart {
    buyerIdentity {
      isAuthenticated
      customer { id numberOfOrders }
    }
    cost {
      subtotalAmount { amount }
    }
    lines {
      id
      quantity
      merchandise {
        __typename
        ... on ProductVariant {
          id
          product { id }
        }
      }
    }
  }
  discount {
    discountClasses
    metafield(namespace: "freetheroot_rewards", key: "function-configuration") {
      jsonValue
    }
  }
}
