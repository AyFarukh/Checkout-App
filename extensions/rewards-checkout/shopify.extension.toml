api_version = "2026-07"

[[extensions]]
name = "FreeTheRoots Checkout Rewards"
handle = "ftr-rewards-checkout"
uid = "22725dc6-cd69-4a6e-4474-18cdb9dd80e96ac368dc"
type = "ui_extension"


[[extensions.targeting]]
target = "purchase.checkout.block.render"
module = "./src/CheckoutRewards.js"

[extensions.capabilities]
api_access = true
network_access = true

[extensions.settings]
[[extensions.settings.fields]]
key = "api_base_url"
type = "single_line_text_field"
name = "Rewards API URL"
description = "Public HTTPS URL of the Rewards backend, without a trailing slash."

[[extensions.settings.fields]]
key = "heading"
type = "single_line_text_field"
name = "Heading"
description = "Heading displayed in checkout."
