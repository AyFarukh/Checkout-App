api_version = "2026-07"

[[extensions]]
name = "Checkout Upsell"
handle = "checkout-upsell"
type = "ui_extension"

[[extensions.targeting]]
target = "purchase.checkout.block.render"
module = "./src/Checkout.jsx"

[extensions.capabilities]
api_access = true
network_access = false

[extensions.settings]
[[extensions.settings.fields]]
key = "heading"
type = "single_line_text_field"
name = "Heading"
description = "Heading displayed above checkout upsells"

[[extensions.settings.fields]]
key = "fixed_product"
type = "product_reference"
name = "Fixed upsell product"
description = "Optional product shown as a fixed upsell"
