api_version = "2026-07"

[[extensions]]
name = "Checkout Upsell"
handle = "checkout-upsell"
uid = "42a78221-416b-44aa-07ba-7ad811835d0691422ded"
type = "ui_extension"

[[extensions.targeting]]
target = "purchase.checkout.block.render"
module = "./src/Checkout.jsx"

[extensions.capabilities]
api_access = true
network_access = false

[extensions.settings]
[[extensions.settings.fields]]
key = "heading"
type = "single_line_text_field"
name = "Heading"
description = "Heading displayed above checkout upsells"

[[extensions.settings.fields]]
key = "enable_metafield_upsells"
type = "boolean"
name = "Enable product metafield upsells"
description = "Read an upsell variant from each cart product metafield"

[[extensions.settings.fields]]
key = "metafield_namespace"
type = "single_line_text_field"
name = "Metafield namespace"
description = "Product metafield namespace. Default: custom"

[[extensions.settings.fields]]
key = "metafield_key"
type = "single_line_text_field"
name = "Metafield key"
description = "Product metafield key. Default: checkout_upsell_variant"

[[extensions.settings.fields]]
key = "fixed_product"
type = "variant_reference"
name = "Fixed upsell 1"
description = "Always show this product variant when it is not already in checkout"

[[extensions.settings.fields]]
key = "fixed_product_2"
type = "variant_reference"
name = "Fixed upsell 2"
description = "Optional second product variant that is always offered"

[[extensions.settings.fields]]
key = "fixed_product_3"
type = "variant_reference"
name = "Fixed upsell 3"
description = "Optional third product variant that is always offered"

[[extensions.settings.fields]]
key = "rule_1_trigger"
type = "variant_reference"
name = "Rule 1 - cart product"
description = "When this product is in checkout, show the Rule 1 upsell"

[[extensions.settings.fields]]
key = "rule_1_offer"
type = "variant_reference"
name = "Rule 1 - upsell product"
description = "Product variant to offer when Rule 1 cart product is present"

[[extensions.settings.fields]]
key = "rule_2_trigger"
type = "variant_reference"
name = "Rule 2 - cart product"
description = "When this product is in checkout, show the Rule 2 upsell"

[[extensions.settings.fields]]
key = "rule_2_offer"
type = "variant_reference"
name = "Rule 2 - upsell product"
description = "Product variant to offer when Rule 2 cart product is present"

[[extensions.settings.fields]]
key = "rule_3_trigger"
type = "variant_reference"
name = "Rule 3 - cart product"
description = "When this product is in checkout, show the Rule 3 upsell"

[[extensions.settings.fields]]
key = "rule_3_offer"
type = "variant_reference"
name = "Rule 3 - upsell product"
description = "Product variant to offer when Rule 3 cart product is present"
